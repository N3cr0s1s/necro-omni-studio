<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Necro Omni Studio</title>
    <!--
      A strict CSP in the renderer. It runs local UI code and must never be able to fetch or execute
      anything remote; the sidecar is reached over loopback, which `connect-src` allows explicitly.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http://127.0.0.1:*; media-src 'self' blob: http://127.0.0.1:*; connect-src 'self' http://127.0.0.1:* ws://127.0.0.1:*"
    />
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        background: #0d0e11;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
